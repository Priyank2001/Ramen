<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confusion Explorer</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #85847e; --line: #e4e3df; --line2: #cfcec8;
  --accent: #2a78d6; --bar-a: #a3a29b; --bar-b: #2a78d6;
  --hl: #0b0b0b; --hover: rgba(42,120,214,.08); --good: #0ca30c; --bad: #e34948;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #8d8c85; --line: #2e2e2c; --line2: #44433f;
    --accent: #3987e5; --bar-a: #6d6c66; --bar-b: #3987e5;
    --hl: #f0efec; --hover: rgba(57,135,229,.14); --good: #2fbf2f; --bad: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #8d8c85; --line: #2e2e2c; --line2: #44433f;
  --accent: #3987e5; --bar-a: #6d6c66; --bar-b: #3987e5;
  --hl: #f0efec; --hover: rgba(57,135,229,.14); --good: #2fbf2f; --bad: #e66767;
  color-scheme: dark; 
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); background: var(--surface);
  position: sticky; top: 0; z-index: 5; }
h1 { font-size: 16px; margin: 0 0 10px; font-weight: 650; letter-spacing: -.01em; }
h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl > label, .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ctl .row { display: flex; gap: 4px; align-items: center; }
select, input[type=text], input[type=search], button {
  font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line2);
  border-radius: 6px; padding: 4px 7px; height: 28px; }
select { max-width: 290px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; height: 28px; }
.seg button { border: 0; border-radius: 0; height: 26px; background: var(--raised); color: var(--ink2); padding: 0 10px; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button.on { background: var(--accent); color: #fff; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; width: 16px; height: 16px; line-height: 16px;
  text-align: center; border-radius: 4px; color: #fff; margin-right: 2px; }
.tag.a { background: var(--bar-a); } .tag.b { background: var(--bar-b); }
main { padding: 14px 20px 40px; }
.summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: stretch; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
.tile .v { font-size: 20px; font-weight: 650; }
.tile .s { color: var(--muted); font-size: 11.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.domains { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  overflow-x: auto; flex: 1 1 380px; max-width: 100%; }
.domains table { border-collapse: collapse; font-size: 12px; }
.domains td, .domains th { padding: 1px 7px; text-align: right; white-space: nowrap; }
.domains th { color: var(--muted); font-weight: 500; }
.domains td:first-child, .domains th:first-child { text-align: left; }
.domains tr.dom { cursor: pointer; } .domains tr.dom:hover { background: var(--hover); }
.domains tr.on td { font-weight: 650; box-shadow: inset 2px 0 0 var(--accent); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.matrix { position: relative; padding: 8px; }
.matrix canvas { display: block; touch-action: none; outline: none; cursor: crosshair; max-width: 100%; }
.matrix canvas.drag { cursor: grabbing; }
.matrix canvas:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 4px; }
.mbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 4px 4px 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--ink2); }
.ramp { display: inline-flex; align-items: center; gap: 5px; }
.ramp i { display: inline-block; width: 90px; height: 10px; border-radius: 2px; border: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 11.5px; }
.zoom { margin-left: auto; display: flex; gap: 4px; }
.zoom button { width: 28px; padding: 0; }
#tip { position: absolute; pointer-events: none; z-index: 4; background: var(--raised); border: 1px solid var(--line2);
  border-radius: 6px; padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
  max-width: 330px; display: none; }
#tip b { font-weight: 600; }
#tip table { border-collapse: collapse; margin-top: 4px; }
#tip td { padding: 0 6px 0 0; }
.side { padding: 12px 14px; position: sticky; top: 118px; max-height: calc(100vh - 130px); overflow: auto; }
.side h2 { font-size: 14px; margin: 0 0 2px; }
.side h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  margin: 14px 0 6px; font-weight: 600; }
.side .sub { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 10px 0; }
.bars { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 3px 8px; align-items: center; font-size: 12px; }
.bars .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.bars .nm:hover { color: var(--accent); text-decoration: underline; }
.bars .bb { display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.bars .bb div { display: flex; align-items: center; gap: 4px; height: 9px; font-size: 10.5px; color: var(--ink2); }
.bars .bb span.bar { height: 7px; border-radius: 0 3px 3px 0; min-width: 1px; }
.bars .bb span.a { background: var(--bar-a); } .bars .bb span.b { background: var(--bar-b); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; }
.kv .k { color: var(--muted); }
table.mini { border-collapse: collapse; width: 100%; font-size: 12px; }
table.mini td, table.mini th { padding: 2px 4px; text-align: right; }
table.mini th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
table.mini td:first-child, table.mini th:first-child { text-align: left; }
a.cls { color: var(--ink); cursor: pointer; text-decoration: underline dotted var(--muted); }
a.cls:hover { color: var(--accent); }
.tables { margin-top: 14px; padding: 10px 14px 14px; }
.tabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.tabs .seg button { padding: 0 12px; }
.scroll { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
table.list { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.list th { position: sticky; top: 0; background: var(--raised); text-align: right; font-weight: 600;
  color: var(--ink2); padding: 5px 8px; border-bottom: 1px solid var(--line2); cursor: pointer; white-space: nowrap; user-select: none; }
table.list th.sorted { color: var(--accent); }
table.list td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td.t, table.list th.t { text-align: left; }
table.list td.t { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
table.list tbody tr { cursor: pointer; } table.list tbody tr:hover { background: var(--hover); }
table.list tbody tr.on { box-shadow: inset 3px 0 0 var(--accent); }
.foot { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
#status { color: var(--muted); font-size: 12px; min-height: 18px; }
.methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; margin-bottom: 12px; }
.methods .m { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.methods .hd { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
.methods .nm { font-weight: 650; }
.methods .kind { font-size: 10.5px; color: var(--ink2); border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; }
.methods .kind.oracle, .methods .kind.control { color: var(--bad); border-color: var(--bad); }
.methods .kind.sanity, .methods .kind.rerun { color: var(--muted); }
.methods .tx { color: var(--ink); font-size: 12.5px; }
.methods .st { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.methods details { margin-top: 3px; font-size: 11.5px; color: var(--ink2); }
.methods summary { cursor: pointer; color: var(--muted); }
.methods code { font-size: 11px; }
.err { max-width: 680px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; }
.err code { background: var(--page); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Confusion explorer <span id="subtitle">cached Ramen TTA runs · rows = true class, columns = predicted class</span></h1>
  <div class="controls">
    <div class="ctl"><label for="ds">Dataset</label><select id="ds"></select></div>
    <div class="ctl"><label><span class="tag a">A</span> baseline run</label>
      <div class="row"><select id="aVar"></select><select id="aSeed" title="seed"></select></div></div>
    <div class="ctl"><label>&nbsp;</label><button id="swap" title="Swap A and B">⇄</button></div>
    <div class="ctl"><label><span class="tag b">B</span> compared run</label>
      <div class="row"><select id="bVar"></select><select id="bSeed" title="seed"></select></div></div>
    <div class="ctl"><label for="dom">Domain</label><select id="dom"></select></div>
    <div class="ctl"><span class="lbl">Show</span>
      <div class="seg" id="view"><button data-v="A">A</button><button data-v="B">B</button><button data-v="diff">B − A</button></div></div>
    <div class="ctl"><span class="lbl">Values</span>
      <div class="seg" id="norm"><button data-v="row" title="% of the true class (row-normalised)">row %</button><button data-v="count" title="number of images (mean per run when seeds are pooled)">count</button></div></div>
    <div class="ctl"><label for="order">Class order</label><select id="order"></select></div>
    <div class="ctl"><label for="top">Classes shown</label>
      <div class="row"><select id="top" title="Keep only the classes involved in the most errors (follows Show and Values)"></select><select id="rank"></select></div></div>
    <div class="ctl"><label for="gamma">Contrast</label><input id="gamma" type="range" min="0.2" max="1" step="0.05" value="0.5" style="width:90px;height:28px"></div>
    <div class="ctl"><label for="find">Find class</label><input id="find" type="search" list="classlist" placeholder="type a class…" style="width:170px"><datalist id="classlist"></datalist></div>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="methods" id="methods"></div>
  <div class="layout">
    <div class="panel matrix" id="mwrap">
      <div class="mbar">
        <div class="legend" id="legend"></div>
        <div class="zoom"><button id="zin" title="Zoom in (+)">+</button><button id="zout" title="Zoom out (−)">−</button><button id="zfit" title="Fit (0)" style="width:auto;padding:0 8px">fit</button></div>
      </div>
      <canvas id="cv" tabindex="0" aria-label="Confusion matrix. Arrow keys move, Enter selects, plus and minus zoom."></canvas>
      <div class="hint" id="hint">Scroll to zoom · drag to pan · click a cell to inspect it · double-click to fit · arrow keys + Enter when focused</div>
      <div id="tip"></div>
      <div id="status"></div>
    </div>
    <aside class="panel side" id="side"></aside>
  </div>
  <section class="panel tables">
    <div class="tabs">
      <div class="seg" id="tab"><button data-v="pairs">Confused pairs</button><button data-v="classes">Classes</button></div>
      <input id="filter" type="search" placeholder="filter by class name…" style="width:220px">
      <span class="hint" id="tabhint"></span>
    </div>
    <div class="scroll"><table class="list" id="list"></table></div>
    <div class="foot" id="listfoot"></div>
  </section>
</main>
<script>
// ------------------------------------------------------------------ data loading
const CMX = { manifest: null, runs: {}, pending: {} };
function b64buf(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
CMX.add = (id, payload) => {
  CMX.runs[id] = payload.domains.map(d => ({
    k: d.k ? new Uint32Array(b64buf(d.k)) : new Uint32Array(0),
    c: d.c ? (d.w === 4 ? new Uint32Array(b64buf(d.c)) : new Uint16Array(b64buf(d.c))) : new Uint16Array(0),
  }));
  if (CMX.pending[id]) CMX.pending[id].resolve();
};
function loadRun(id) {
  if (CMX.runs[id]) return Promise.resolve();
  if (CMX.pending[id]) return CMX.pending[id].promise;
  const p = {};
  p.promise = new Promise((res, rej) => { p.resolve = res; p.reject = rej; });
  CMX.pending[id] = p;
  const s = document.createElement('script');
  s.src = 'data/runs/' + encodeURIComponent(id) + '.js';
  s.onerror = () => { delete CMX.pending[id]; p.reject(new Error('could not load ' + id)); };
  document.head.appendChild(s);
  return p.promise;
}
</script>
<script src="data/manifest.js"></script>
<script src="methods.js"></script>
<script>
// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (x, d = 1) => (x == null || Number.isNaN(x)) ? '–' : x.toFixed(d);
const sgn = (x, d = 2) => (x == null || Number.isNaN(x)) ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '±') + Math.abs(x).toFixed(d);
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const fmtCount = x => x == null || Number.isNaN(x) ? '–' : (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(1));

if (!CMX.manifest) {
  document.body.innerHTML = `<div class="err"><h2>No data yet</h2><p>Build the data files from the cached results first:</p>
    <p><code>~/miniconda3/envs/RAMEN/bin/python new_experiments/confusion_explorer/build_data.py</code></p>
    <p>then serve this folder, e.g. <code>cd new_experiments/confusion_explorer &amp;&amp; python -m http.server 8765</code>.</p></div>`;
  throw new Error('manifest missing');
}
const MAN = CMX.manifest;
const MODE_ORDER = { mixed: 0, sequential: 1, single: 2 };

// variants = runs that differ only by seed
function variantsOf(ds) {
  const runs = Object.entries(MAN.runs).filter(([, r]) => r.dataset === ds);
  const models = new Set(runs.map(([, r]) => r.model));
  const vs = {};
  for (const [id, r] of runs) {
    const key = [r.model, r.mode, r.n, r.bs, r.algo].join('|');
    if (!vs[key]) {
      const extra = [models.size > 1 ? r.model.replace('clip_', '') : null, r.n !== 'all' ? 'n=' + r.n : null,
                     r.bs !== 100 ? 'bs=' + r.bs : null].filter(Boolean).join(', ');
      vs[key] = { key, algo: r.algo, mode: r.mode, model: r.model, label: r.algo + (extra ? ` (${extra})` : ''), seeds: {} };
    }
    vs[key].seeds[r.seed] = id;
  }
  return Object.values(vs).sort((a, b) => (MODE_ORDER[a.mode] - MODE_ORDER[b.mode]) || a.model.localeCompare(b.model) ||
    (a.algo === 'NoAdapt' ? -1 : b.algo === 'NoAdapt' ? 1 : 0) || (a.algo === 'Ramen' ? -1 : b.algo === 'Ramen' ? 1 : 0) ||
    a.algo.localeCompare(b.algo));
}

// ------------------------------------------------------------------ state
const S = { ds: null, a: { v: null, seed: '0' }, b: { v: null, seed: '0' }, dom: 'all', view: 'diff', norm: 'row',
  order: 'index', top: 'all', rank: 'pairs', gamma: 0.5, sel: null, cell: null, tab: 'pairs', filter: '',
  sort: { pairs: ['b', -1], classes: ['d', 1] } };
let VARS = [], DS = null, K = 0, N = 0, D = null;   // K classes, N of them shown; D = derived matrices
const V = { s: 1, tx: 0, ty: 0, fit: 1 };     // view transform: cell (row r, col c) -> (x0 + tx + c*s, y0 + ty + r*s)
let hover = null;                             // [row pos, col pos]

function runIds(side) {
  const v = VARS.find(x => x.key === S[side].v);
  if (!v) return [];
  if (S[side].seed === 'pooled') return Object.values(v.seeds);
  return v.seeds[S[side].seed] ? [v.seeds[S[side].seed]] : [Object.values(v.seeds)[0]];
}
function runSeeds(side) {
  return runIds(side).map(id => MAN.runs[id].seed);
}

// ------------------------------------------------------------------ matrices
const mcache = new Map();
function matrix(ids, dom) {
  const key = ids.join(',') + '@' + dom;
  if (mcache.has(key)) { const m = mcache.get(key); mcache.delete(key); mcache.set(key, m); return m; }
  const M = new Float64Array(K * K);
  const doms = dom === 'all' ? DS.domains.map((_, i) => i) : [Number(dom)];
  for (const id of ids) for (const d of doms) {
    const { k, c } = CMX.runs[id][d];
    for (let i = 0; i < k.length; i++) M[(k[i] >>> 16) * K + (k[i] & 0xffff)] += c[i];
  }
  if (ids.length > 1) for (let i = 0; i < M.length; i++) M[i] /= ids.length;  // mean count per run
  const row = new Float64Array(K), col = new Float64Array(K);
  let total = 0, correct = 0;
  for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) {
    const x = M[i * K + j]; row[i] += x; col[j] += x; total += x; if (i === j) correct += x;
  }
  const m = { M, row, col, total, acc: total ? correct / total * 100 : NaN, nRuns: ids.length };
  mcache.set(key, m);
  while (mcache.size > 8) mcache.delete(mcache.keys().next().value);
  return m;
}
const val = (m, i, j) => S.norm === 'row' ? (m.row[i] ? m.M[i * K + j] / m.row[i] * 100 : NaN) : m.M[i * K + j];
const accOf = (m, i) => m.row[i] ? m.M[i * K + i] / m.row[i] * 100 : NaN;

// per-class, per-domain accuracy straight from the sparse counts
function classByDomain(ids, c) {
  return DS.domains.map((_, d) => {
    let n = 0, ok = 0;
    for (const id of ids) {
      const { k, c: cnt } = CMX.runs[id][d];
      for (let i = 0; i < k.length; i++) if ((k[i] >>> 16) === c) { n += cnt[i]; if ((k[i] & 0xffff) === c) ok += cnt[i]; }
    }
    return { n: n / ids.length, acc: n ? ok / n * 100 : NaN };
  });
}
function cellByDomain(ids, i, j) {
  return DS.domains.map((_, d) => {
    let n = 0, x = 0;
    const key = ((i << 16) | j) >>> 0;
    for (const id of ids) {
      const { k, c } = CMX.runs[id][d];
      for (let t = 0; t < k.length; t++) if ((k[t] >>> 16) === i) { n += c[t]; if (k[t] === key) x += c[t]; }
    }
    return { n: n / ids.length, x: x / ids.length, pct: n ? x / n * 100 : NaN };
  });
}

// ------------------------------------------------------------------ class orders
function clusterOrder(A, B) {
  // Single-linkage leaf order of the symmetric confusion graph: w(i,j) = row-% confusion both ways, A and B summed.
  // Merging the strongest pairs first keeps mutually confused classes in contiguous blocks; a sink only links its
  // block late, since each row sends it a small share. When two blocks merge, the linking classes are put side by side.
  const W = new Map();
  for (const m of [A, B]) for (let i = 0; i < K; i++) {
    if (!m.row[i]) continue;
    for (let j = 0; j < K; j++) if (i !== j) { const x = m.M[i * K + j];
      if (x) { const key = i < j ? i * K + j : j * K + i; W.set(key, (W.get(key) || 0) + x / m.row[i]); } }
  }
  const edges = [...W].sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  const parent = [...Array(K).keys()], members = Array.from({ length: K }, (_, i) => [i]);
  const root = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  for (const [key] of edges) {
    const i = Math.floor(key / K), j = key % K, ri = root(i), rj = root(j);
    if (ri === rj) continue;
    let a = members[ri], b = members[rj];
    if (a.indexOf(i) < a.length / 2) a.reverse();  // i towards the end of a
    if (b.indexOf(j) > b.length / 2) b.reverse();  // j towards the start of b
    const big = a.length >= b.length ? ri : rj, small = big === ri ? rj : ri;
    parent[small] = big; members[big] = a.concat(b); members[small] = null;
  }
  const blocks = members.filter((m, r) => m && root(r) === r).sort((x, y) => y.length - x.length || x[0] - y[0]);
  return blocks.flat();
}
function computeOrder(A, B) {

// ------------------------------------------------------------------ selection

  draw(); renderSide(); markRows(); saveHash();
}
function selectClass(c, zoom) {

function noteHidden() {  // the matrix hint says when the selection lies outside the shown classes

// ------------------------------------------------------------------ tables
function pairsData() {
  const A = D.A, B = D.B, out = [];
  for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) {
    if (i === j) continue;
    const q = i * K + j, a = A.M[q], b = B.M[q];
    if (!a && !b) continue;
    const pa = A.row[i] ? a / A.row[i] * 100 : NaN, pb = B.row[i] ? b / B.row[i] * 100 : NaN;
    out.push({ i, j, a, b, pa, pb, d: pb - pa, dn: b - a });
  }
  return out;
}
function classesData() {
  const A = D.A, B = D.B, out = [];
  for (let c = 0; c < K; c++) {
    if (!A.row[c] && !B.row[c]) continue;
    const aa = accOf(A, c), ab = accOf(B, c);
    out.push({ c, n: A.row[c], aa, ab, d: ab - aa, xa: A.row[c] ? A.col[c] / A.row[c] : NaN, xb: B.row[c] ? B.col[c] / B.row[c] : NaN,
      g: DS.superclasses ? DS.superclasses[DS.classes[c]] || '' : '' });
  }
  return out;
}
const COLS = {
  pairs: [['t', 'true → predicted', 1], ['a', 'A images', -1], ['pa', 'A % of class', -1], ['b', 'B images', -1], ['pb', 'B % of class', -1],
          ['d', 'Δ % (B−A)', -1], ['dn', 'Δ images', -1]],
  classes: [['t', 'class', 1], ['n', 'images', -1], ['aa', 'A acc %', 1], ['ab', 'B acc %', 1], ['d', 'Δ acc', 1],
            ['xa', 'A pred / true', -1], ['xb', 'B pred / true', -1]],
};
let TABLE_ROWS = [];
function renderTable() {
  const tab = S.tab, cols = COLS[tab].slice();
  if (tab === 'classes' && DS.superclasses) cols.splice(1, 0, ['g', 'group', 1]);
  const [key, dir] = S.sort[tab];
  let rows = tab === 'pairs' ? pairsData() : classesData();
  const f = S.filter.trim().toLowerCase();
  if (f) rows = rows.filter(r => tab === 'pairs' ? (DS.classes[r.i].toLowerCase().includes(f) || DS.classes[r.j].toLowerCase().includes(f))
    : (DS.classes[r.c].toLowerCase().includes(f) || r.g.toLowerCase().includes(f)));
  const total = rows.length;
  const getv = (r, k) => k === 't' ? (tab === 'pairs' ? DS.classes[r.i] + ' ' + DS.classes[r.j] : DS.classes[r.c]) : r[k];
  rows.sort((x, y) => {
    const a = getv(x, key), b = getv(y, key);
    if (typeof a === 'string') return dir * a.localeCompare(b);
    const na = Number.isNaN(a), nb = Number.isNaN(b);
    return (na - nb) || dir * (a - b) || (tab === 'pairs' ? y.b - x.b : x.c - y.c);
  });
  rows = rows.slice(0, 400);
  TABLE_ROWS = rows;
  const head = `<thead><tr>${cols.map(([k, t]) => `<th class="${k === 't' || k === 'g' ? 't' : 'n'}${k === key ? ' sorted' : ''}" data-k="${k}">${t}${k === key ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead>`;
  const cell = (r, k) => {
    switch (k) {
      case 't': return tab === 'pairs' ? `<td class="t" title="${esc(DS.classes[r.i])} → ${esc(DS.classes[r.j])}">${esc(DS.classes[r.i])} → ${esc(DS.classes[r.j])}</td>`
                                       : `<td class="t" title="${esc(DS.classes[r.c])}">${esc(DS.classes[r.c])}</td>`;
      case 'g': return `<td class="t">${esc(r.g)}</td>`;
      case 'a': case 'b': case 'n': return `<td class="n">${fmtCount(r[k])}</td>`;
      case 'pa': case 'pb': return `<td class="n">${fmt(r[k], 2)}</td>`;
      case 'aa': case 'ab': return `<td class="n">${fmt(r[k], 1)}</td>`;
      case 'd': return `<td class="n ${cls(tab === 'pairs' ? -r.d : r.d)}">${sgn(r.d, tab === 'pairs' ? 2 : 1)}</td>`;
      case 'dn': return `<td class="n ${cls(-r.dn)}">${sgn(r.dn, 1).replace(/\.0$/, '')}</td>`;
      case 'xa': case 'xb': return `<td class="n">${fmt(r[k], 2)}×</td>`;
    }
  };
  const body = `<tbody>${rows.map((r, k) => `<tr data-k="${k}">${cols.map(([c]) => cell(r, c)).join('')}</tr>`).join('')}</tbody>`;
  $('list').innerHTML = head + body;
  $('list').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k, def = COLS[tab].concat([['g', '', 1]]).find(c => c[0] === k)[2];
    S.sort[tab] = [k, S.sort[tab][0] === k ? -S.sort[tab][1] : def]; renderTable();
  });
  $('list').querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => {
    const r = TABLE_ROWS[Number(tr.dataset.k)];
    if (tab === 'pairs') selectCell(r.i, r.j, true); else selectClass(r.c, true);
  });
  $('listfoot').textContent = `${total.toLocaleString()} ${tab === 'pairs' ? 'off-diagonal cells with at least one image under A or B' : 'classes'}` +
    (total > 400 ? ' · showing the first 400 in this order' : '') + (D.A.nRuns > 1 || D.B.nRuns > 1 ? ' · counts are means per run' : '') +
    ` · ${S.dom === 'all' ? 'all domains' : DS.domains[S.dom]}`;
  $('tabhint').textContent = tab === 'pairs' ? 'click a column to sort · click a row to zoom to that cell' : 'pred / true > 1: over-predicted (a sink) · click a row to select the class';
  markRows();
}
function markRows() {
  $('list').querySelectorAll('tbody tr').forEach(tr => {
    const r = TABLE_ROWS[Number(tr.dataset.k)];

  if (!VARS.some(v => v.key === S.b.v)) S.b.v = find('Ramen', mixed) || find('Ramen', VARS) || (VARS[1] || VARS[0]).key;
}
function setDataset(ds, keepSel) {
  S.ds = ds; DS = MAN.datasets[ds]; K = DS.classes.length; VARS = variantsOf(ds);
  mcache.clear();
  pickDefaultVariants();
  fillVariant($('aVar'), 'a'); fillVariant($('bVar'), 'b'); fillSeed($('aSeed'), 'a'); fillSeed($('bSeed'), 'b');
  $('dom').innerHTML = `<option value="all">all ${DS.domains.length > 1 ? DS.domains.length + ' domains' : ''}</option>` +
    (DS.domains.length > 1 ? DS.domains.map((d, i) => `<option value="${i}">${esc(d)}</option>`).join('') : '');
  if (S.dom !== 'all' && !(Number(S.dom) < DS.domains.length)) S.dom = 'all';
  $('dom').value = S.dom; $('dom').disabled = DS.domains.length < 2;
  $('classlist').innerHTML = DS.classes.map(c => `<option value="${esc(c)}">`).join('');
  fillOrder(); fillTop();
  if (!keepSel) { S.sel = null; S.cell = null; }
  if (S.sel != null && S.sel >= K) { S.sel = null; S.cell = null; }
  V.fit = 0; N = 0;
  layoutCanvas();
}

let refreshing = 0;
async function refresh(opts = {}) {
  const ticket = ++refreshing;
  const ids = [...new Set([...runIds('a'), ...runIds('b')])];
  const missing = ids.filter(id => !CMX.runs[id]);
  if (missing.length) $('status').textContent = `loading ${missing.length} run${missing.length > 1 ? 's' : ''}…`;
  try { await Promise.all(ids.map(loadRun)); }
  catch (e) { $('status').textContent = String(e.message || e); return; }
  if (ticket !== refreshing) return;
  $('status').textContent = '';
  const t0 = performance.now();
  derive(); renderLegend(); renderSummary(); renderMethods();
  noteHidden();
  if (opts.zoomSel && S.sel != null && INV[S.cell ? S.cell[0] : S.sel] >= 0 && INV[S.cell ? S.cell[1] : S.sel] >= 0) centerOn(INV[S.cell ? S.cell[0] : S.sel], INV[S.cell ? S.cell[1] : S.sel], side / 30);
  draw(); renderSide(); renderTable(); saveHash();
  const ms = performance.now() - t0;
  if (ms > 400) $('status').textContent = `computed in ${Math.round(ms)} ms`;
}

$('ds').innerHTML = Object.keys(MAN.datasets).sort().map(d => {
  const n = Object.values(MAN.runs).filter(r => r.dataset === d).length;
  return `<option value="${esc(d)}">${esc(d)} (${MAN.datasets[d].classes.length} classes, ${n} runs)</option>`;
}).join('');
$('ds').onchange = () => { S.a.v = S.b.v = null; S.dom = 'all'; setDataset($('ds').value); refresh(); };
$('aVar').onchange = () => { S.a.v = $('aVar').value; fillSeed($('aSeed'), 'a'); refresh(); };
$('bVar').onchange = () => { S.b.v = $('bVar').value; fillSeed($('bSeed'), 'b'); refresh(); };
$('aSeed').onchange = () => { S.a.seed = $('aSeed').value; refresh(); };
$('bSeed').onchange = () => {
  S.b.seed = $('bSeed').value;
  // keep A on the same seed when it has it (NoAdapt has seed 0 only and is stateless, so it stays)
  const va = VARS.find(x => x.key === S.a.v);
  if (S.b.seed === 'pooled' ? Object.keys(va.seeds).length > 1 : va.seeds[S.b.seed]) { S.a.seed = S.b.seed; $('aSeed').value = S.a.seed; }
  refresh();
};
$('swap').onclick = () => { [S.a, S.b] = [S.b, S.a]; fillVariant($('aVar'), 'a'); fillVariant($('bVar'), 'b'); fillSeed($('aSeed'), 'a'); fillSeed($('bSeed'), 'b'); refresh(); };
$('dom').onchange = () => { S.dom = $('dom').value; refresh(); };
$('order').onchange = () => { S.order = $('order').value; fitView(); refresh(); };
$('top').onchange = () => { S.top = $('top').value; $('rank').disabled = S.top === 'all'; refresh(); };
$('rank').onchange = () => { S.rank = $('rank').value; refresh(); };
$('gamma').oninput = () => { S.gamma = Number($('gamma').value); derive(); renderLegend(); draw(); saveHashSoon(); };
$('find').onchange = $('find').oninput = ev => {
  const q = $('find').value.trim().toLowerCase(); if (!q) return;
  let c = DS.classes.findIndex(x => x.toLowerCase() === q);
  if (c < 0 && q.length > 2 && ev.type === 'change') c = DS.classes.findIndex(x => x.toLowerCase().includes(q));
  if (c >= 0) selectClass(c, true);
};
$('filter').oninput = () => { S.filter = $('filter').value; renderTable(); };
seg('view', 'view', () => { derive(); renderLegend(); noteHidden(); draw(); saveHash(); });
seg('norm', 'norm', () => { derive(); renderLegend(); noteHidden(); draw(); renderSide(); saveHash(); });
seg('tab', 'tab', () => { renderTable(); saveHash(); });
darkMQ.addEventListener('change', () => { buildLuts(); levels = new Map(); if (D) { derive(); renderLegend(); draw(); } });
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { layoutCanvas(); draw(); }, 120); });

// ------------------------------------------------------------------ URL state (shareable views)
let hashT;
function saveHashSoon() { clearTimeout(hashT); hashT = setTimeout(saveHash, 300); }
function saveHash() {
  const p = new URLSearchParams({ ds: S.ds, a: S.a.v, as: S.a.seed, b: S.b.v, bs: S.b.seed, d: S.dom, v: S.view, n: S.norm, o: S.order, k: S.top, r: S.rank, g: S.gamma, t: S.tab });
  if (S.sel != null) p.set('c', S.sel);
  if (S.cell) p.set('cell', S.cell.join(','));
  history.replaceState(null, '', '#' + p.toString());
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const ds = p.get('ds') && MAN.datasets[p.get('ds')] ? p.get('ds') : (MAN.datasets.ImageNetC5K ? 'ImageNetC5K' : Object.keys(MAN.datasets).sort()[0]);
  S.a.v = p.get('a'); S.b.v = p.get('b'); S.a.seed = p.get('as') || '0'; S.b.seed = p.get('bs') || '0';
  S.dom = p.get('d') || 'all'; S.view = p.get('v') || 'diff'; S.norm = p.get('n') || 'row';
  S.order = p.get('o') || 'index'; S.top = p.get('k') || 'all'; S.rank = RANKS[p.get('r')] ? p.get('r') : 'pairs'; S.gamma = Number(p.get('g')) || 0.5; S.tab = p.get('t') || 'pairs';
  S.sel = p.has('c') ? Number(p.get('c')) : null;
  S.cell = p.has('cell') ? p.get('cell').split(',').map(Number) : null;
  $('ds').value = ds; $('gamma').value = S.gamma;
  setDataset(ds, true);
}

buildLuts();
syncSeg();
loadHash();
syncSeg();
refresh({ zoomSel: S.sel != null });
</script>
</body>
