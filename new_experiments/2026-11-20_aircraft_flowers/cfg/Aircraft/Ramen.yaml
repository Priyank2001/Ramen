# Cache settings copied unchanged from cfg/CIFAR100C (100 classes, CLIP ViT-B/16), as for Food-101; NOT tuned on Aircraft.
# max_capacity is per class queue; this test split has far fewer images per class, so the queues never fill.
max_capacity: 750
topk: 5
beta: 5.0

optimizer: signsgd
lr: 0.01

# Standard prompt in the CLIP literature (CLIP / CoOp / TPT / TDA); null = the default 7-template ensemble
templates: ["a photo of a {}, a type of aircraft."]
