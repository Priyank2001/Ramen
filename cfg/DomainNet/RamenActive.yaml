max_capacity: 300
topk: 10
beta: 5.0

optimizer: signsgd
lr: 0.01

# which class queues form a query's active set, from its zero-shot prediction, see src/methods/RamenActive.py:
# all (== Ramen) | topm (query's top_m zero-shot classes) | prob (weighted by softmax(zero-shot logits / temperature))
active_set: all
top_m: 5
temperature: 1.0

# per query, log the stream ids of this many highest-weight retrieved cache entries (for cache_viewer.py)
log_support: 8

# snapshot of the predicted class's queue per sample (CacheViewer); large when max_capacity is large
log_queue: false
