max_capacity: 75
topk: 1
beta: 0.0

optimizer: signsgd
lr: 0.01

# Ramen's own active set (all class queues, equal weight), see src/methods/RamenActive.py
active_set: all

# oracle control of cache contamination, uses TRUE labels (upper bound, not a method), see src/methods/RamenOracle.py:
# none (== Ramen) | file_true | drop_wrong | drop_confident_wrong | random_like_wrong | random_like_cw
oracle: none
oracle_seed: 0          # random_like_* only
memory_log_every: 10    # batches between memory composition snapshots

log_support: 8
log_queue: false
