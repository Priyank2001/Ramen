# Ramen's config, plus which class queue each test image is written to. true_label uses the TRUE labels
# (an oracle / upper bound, not a method), see src/methods/RamenTrueLabel.py: zero_shot (== Ramen) | true_label
# Cache settings from CIFAR10C (the other 10-class setup); not tuned on EuroSAT
max_capacity: 7500
topk: 50
beta: 5.0

optimizer: signsgd
lr: 0.01

# Standard EuroSAT prompt in the CLIP literature (CoOp / TPT / TDA); null = the default 7-template ensemble
templates: ["a centered satellite photo of {}."]

filing: zero_shot
